git <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health-Benefits Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a phone-width app shell centred on the page, teal palette from the Healthcare reference. */
:root{
  --teal:#0F766E; --mint:#99F6E4; --mist:#F0FDFA; --deep:#134E4A;
  --ink:#0E2A28; --muted:#5B7370; --line:#D3E8E4; --card:#FFFFFF;
  --warn:#B45309; --warn-bg:#FEF3C7; --bad:#B42318; --bad-bg:#FEE4E2; --ok-bg:#CCFBF1;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--mist);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.stage{height:100%;display:flex;justify-content:center;align-items:stretch}
.shell{width:100%;max-width:440px;height:100%;background:var(--mist);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media (min-width:600px){
  .stage{padding:16px 0;background:linear-gradient(180deg,#DDF7F2,#F0FDFA)}
  .shell{height:100%;border-radius:28px;box-shadow:0 20px 60px rgba(19,78,74,.22);border:1px solid var(--line)}
}
.scroll{flex:1;overflow-y:auto;padding:16px 16px 24px;-webkit-overflow-scrolling:touch}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;color:var(--deep)}
h1{font-size:28px;line-height:1.1} h2{font-size:20px} h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.tint{background:var(--ok-bg);border-color:var(--mint)}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:600;cursor:pointer;background:var(--teal);color:#fff;width:100%;transition:background .15s}
.btn:hover{background:var(--deep)}
.btn.alt{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
.btn.alt:hover{background:var(--mist)}
.btn.ghost{background:transparent;color:var(--teal);width:auto;padding:8px 10px}
.btn.danger{background:var(--bad)}
.btn.sm{padding:8px 12px;width:auto;font-size:13px;border-radius:10px}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
label{display:block;font-weight:600;font-size:13px;margin-bottom:5px;color:var(--deep)}
input,select,textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(153,246,228,.55)}
textarea{min-height:70px;resize:vertical}
.field{margin-bottom:12px}
.err{color:var(--bad);font-size:13px;margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-bg);color:var(--deep)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.gray{background:#E8F0EE;color:var(--muted)}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.topbar h2{flex:1}
.back{border:0;background:#fff;border:1px solid var(--line);width:36px;height:36px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--teal)}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{border:0;background:none;padding:6px 2px;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:12px}
.nav button.on{color:var(--teal);background:var(--mist)}
.hero{background:var(--deep);color:#fff;padding:36px 22px 28px;border-radius:0 0 28px 28px}
.hero h1{color:#fff;margin-top:14px}
.hero p{color:#BFE9E3;margin-top:8px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--teal);display:grid;place-items:center;color:#fff}
.demo{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.otp{letter-spacing:.6em;text-align:center;font-size:24px;font-weight:700}
.steps{display:flex;gap:6px;margin:4px 0 16px}
.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)} .steps i.on{background:var(--teal)}
.ring{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--mint) calc(var(--p)*1%),rgba(255,255,255,.18) 0);display:grid;place-items:center;flex:none}
.ring b{width:64px;height:64px;border-radius:50%;background:var(--deep);display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-size:20px}
.score{background:var(--deep);color:#fff;border-radius:20px;padding:16px}
.score h3{color:#fff} .score .muted{color:#BFE9E3}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.18);color:#fff}
.dot.done{background:var(--mint);color:var(--deep)}
.light .dot{background:#E3EFEC;color:#fff} .light .dot.done{background:var(--teal);color:#fff}
.tile{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;cursor:pointer;font-weight:600}
.tile .ic{color:var(--teal)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{border:2px dashed var(--teal);background:#fff;border-radius:16px;padding:18px;text-align:center;cursor:pointer;color:var(--teal);font-weight:600}
.drop.hot{background:var(--ok-bg)}
.drop input{display:none}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)} .kv span:nth-child(even){font-weight:600;text-align:right}
.bar{height:8px;background:#E3EFEC;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
.modal{position:absolute;inset:0;background:rgba(14,42,40,.5);display:flex;align-items:flex-end;z-index:20}
.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:18px 16px 22px;max-height:88%;overflow:auto}
.toast{position:absolute;left:16px;right:16px;bottom:78px;background:var(--deep);color:#fff;padding:12px 14px;border-radius:12px;font-weight:600;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.hr{height:1px;background:var(--line);margin:4px 0}
.tag{font-size:11px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.06em}
.preview{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:var(--mist)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="stage"><div class="shell" id="shell"><div id="app" style="display:flex;flex-direction:column;height:100%"></div><div id="layer"></div></div></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const ICONS={
 home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
 pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
 folder:'<path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 upload:'<path d="M12 16V4m0 0l-4 4m4-4l4 4M4 20h16"/>',
 check:'<path d="M5 12l5 5 9-10"/>',
 alert:'<path d="M12 9v4m0 4h.01M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
 file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 claim:'<path d="M9 3h6a1 1 0 0 1 1 1v2H8V4a1 1 0 0 1 1-1zM8 5H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2M9 14l2 2 4-4"/>',
 cross:'<path d="M12 5v14M5 12h14" stroke-width="3"/>'
};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const BG=['A+','A-','B+','B-','O+','O-','AB+','AB-','Not sure'];
const CONDS=['Diabetes','Hypertension','Asthma','Heart condition','Thyroid','Arthritis','Kidney condition','None'];
const REASONS=['Managing a long-term condition','Planned surgery or treatment','Looking after my family and parents','Pregnancy or childcare','Understand my insurance cover','Keep all my records in one place','Other'];
const REC_TYPES=['Discharge summary','Hospital bill','Lab report','Prescription','Scan or X-ray','ID proof','Vaccination record','Other'];
const CLAIM_DOCS=['Discharge summary','Hospital bill','Lab report','Prescription','ID proof'];
const INSURERS=['Star Health','HDFC ERGO','ICICI Lombard','Niva Bupa','Care Health','Bajaj Allianz','Other'];
const RELATIONS=['Spouse','Child','Father','Mother','Other'];
const CITIES=['Pune','Mumbai','Bengaluru','Chennai','Hyderabad','Delhi'];
const SPECIALTIES=['Any','Orthopaedics','Cardiology','General medicine','Maternity','Diabetes care'];
/* Sample, fictional hospitals for the prototype. Not real listings. */
const HOSPITALS=[
 {n:'City Care Hospital',c:'Pune',s:['Orthopaedics','General medicine','Cardiology'],i:['Star Health','HDFC ERGO','Niva Bupa'],room:4500},
 {n:'Lake View Clinic',c:'Pune',s:['General medicine','Diabetes care'],i:['HDFC ERGO','Care Health'],room:3200},
 {n:'Riverside Heart Institute',c:'Pune',s:['Cardiology'],i:['ICICI Lombard','Star Health'],room:7800},
 {n:'Sunrise Mother and Child',c:'Pune',s:['Maternity'],i:['Niva Bupa','Bajaj Allianz','HDFC ERGO'],room:5200},
 {n:'Harbour Multispecialty',c:'Mumbai',s:['Orthopaedics','Cardiology','General medicine'],i:['Star Health','ICICI Lombard','HDFC ERGO'],room:8500},
 {n:'Marine Drive Diabetes Centre',c:'Mumbai',s:['Diabetes care','General medicine'],i:['Care Health','Niva Bupa'],room:4000},
 {n:'Garden City Hospital',c:'Bengaluru',s:['Orthopaedics','General medicine','Maternity'],i:['Star Health','Niva Bupa','Care Health'],room:5000},
 {n:'Tech Park Heart Care',c:'Bengaluru',s:['Cardiology'],i:['HDFC ERGO','ICICI Lombard'],room:7000},
 {n:'Marina Medical Centre',c:'Chennai',s:['General medicine','Orthopaedics'],i:['Star Health','Bajaj Allianz'],room:4200},
 {n:'Coromandel Women and Child',c:'Chennai',s:['Maternity'],i:['Star Health','Care Health'],room:4800},
 {n:'Charminar General Hospital',c:'Hyderabad',s:['General medicine','Cardiology','Diabetes care'],i:['HDFC ERGO','Niva Bupa','Star Health'],room:4600},
 {n:'Deccan Bone and Joint',c:'Hyderabad',s:['Orthopaedics'],i:['ICICI Lombard','Bajaj Allianz'],room:5500},
 {n:'Capital Care Hospital',c:'Delhi',s:['General medicine','Cardiology','Orthopaedics'],i:['Star Health','HDFC ERGO','ICICI Lombard','Care Health'],room:9000},
 {n:'Yamuna Family Clinic',c:'Delhi',s:['General medicine','Maternity','Diabetes care'],i:['Niva Bupa','Care Health'],room:3600}
];

/* ---------- storage ---------- */
const KEY='hbw-prototype-v1';
let DB={users:{}};
try{const r=localStorage.getItem(KEY);if(r)DB=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};
const FILES={}; /* files stay in memory for this session only */
let ui={screen:'login',phone:'',err:'',regStep:1,draft:{conds:[]},draftRecs:[],tab:'home',view:null,viewId:null,city:'Pune',spec:'Any',onlyMine:false,recMember:'all',recType:'all',cdMember:'self',cdPolicy:'',timer:0,toast:''};
let D=null; /* current user's data */

/* ---------- formatting ---------- */
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const fmtDate=s=>{if(!s)return '';const d=new Date(s+(s.length===10?'T00:00:00':''));return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})};
const age=s=>{const b=new Date(s),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const size=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const today=()=>new Date().toISOString().slice(0,10);

/* ---------- app state helpers ---------- */
const member=id=>D.members.find(m=>m.id===id)||D.members[0];
const confirmedPolicies=()=>D.policies.filter(p=>p.confirmed);
function score(){
  const checks=[
    ['Profile created',true],
    ['Emergency contact added',!!D.profile.ecPhone],
    ['At least one policy confirmed',confirmedPolicies().length>0],
    ['At least one record saved',D.records.length>0],
    ['ID proof saved',D.records.some(r=>r.type==='ID proof')]
  ];
  return {checks,pct:Math.round(checks.filter(c=>c[1]).length/checks.length*100)};
}
function toast(t){ui.toast=t;draw();clearTimeout(toast.t);toast.t=setTimeout(()=>{ui.toast='';draw()},2400)}
function go(patch){Object.assign(ui,patch);draw();const s=document.querySelector('.scroll');if(s)s.scrollTop=0}

/* ---------- views ---------- */
function loginView(){
 return `<div class="scroll" style="padding:0">
 <div class="hero"><div class="logo">${ic('shield')}</div><h1>Health-Benefits Wallet</h1><p>Know what your insurance covers, find care that accepts it, and keep your family's records in one place.</p></div>
 <div class="stack" style="padding:20px 16px">
  <div class="field"><label for="phone">Mobile number</label>
   <div class="row"><span class="card" style="padding:11px 12px;font-weight:700">+91</span><input id="phone" inputmode="numeric" maxlength="10" placeholder="10-digit number" value="${esc(ui.phone)}" autocomplete="tel-national"></div>
   ${ui.err?`<div class="err">${esc(ui.err)}</div>`:''}</div>
  <button class="btn" data-act="sendOtp">Send OTP</button>
  <div class="demo">Prototype mode. No SMS is sent. Any valid 10-digit number works, and the OTP is shown on the next screen.</div>
  <div class="hr"></div>
  <button class="btn alt" data-act="demo">Skip sign-in and open a demo profile</button>
  <p class="small muted">Everything you enter stays in this browser only. Nothing is uploaded to a server.</p>
 </div></div>`;
}
function otpView(){
 return `<div class="topbar"><button class="back" data-act="toLogin" aria-label="Back">${ic('back')}</button><h2>Verify your number</h2></div>
 <div class="scroll stack">
  <p class="muted">Enter the 6-digit code for +91 ${esc(ui.phone)}.</p>
  <div class="demo">Demo OTP: <b>123456</b></div>
  <div class="field"><label for="otp">OTP</label><input id="otp" class="otp" inputmode="numeric" maxlength="6" placeholder="······" autocomplete="one-time-code">${ui.err?`<div class="err">${esc(ui.err)}</div>`:''}</div>
  <button class="btn" data-act="verify">Verify and continue</button>
  <button class="btn ghost" data-act="resend" ${ui.timer>0?'disabled':''}>${ui.timer>0?`Resend OTP in ${ui.timer}s`:'Resend OTP'}</button>
 </div>`;
}
function regView(){
 const d=ui.draft,st=ui.regStep;
 const steps=`<div class="steps">${[1,2,3].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>`;
 let body='';
 if(st===1){
  body=`<h2>About you</h2><p class="muted small" style="margin:4px 0 14px">Step 1 of 3. We use this to fill your emergency card and claim forms.</p>
  <div class="field"><label for="name">Full name</label><input id="name" value="${esc(d.name)}" autocomplete="name"></div>
  <div class="field"><label for="dob">Date of birth</label><input id="dob" type="date" max="${today()}" value="${esc(d.dob)}"></div>
  <div class="field"><label for="gender">Gender</label><select id="gender"><option value="">Select</option>${['Female','Male','Other','Prefer not to say'].map(g=>`<option ${d.gender===g?'selected':''}>${g}</option>`).join('')}</select></div>
  <div class="field"><label for="blood">Blood group</label><select id="blood"><option value="">Select</option>${BG.map(g=>`<option ${d.blood===g?'selected':''}>${g}</option>`).join('')}</select></div>`;
 } else if(st===2){
  body=`<h2>Your health</h2><p class="muted small" style="margin:4px 0 14px">Step 2 of 3. Share only what you are comfortable with.</p>
  <div class="field"><label for="reason">Why are you using the wallet?</label><select id="reason"><option value="">Select a reason</option>${REASONS.map(g=>`<option ${d.reason===g?'selected':''}>${g}</option>`).join('')}</select></div>
  <div class="field"><label>Existing conditions</label><div class="chips">${CONDS.map(c=>`<button type="button" class="chip ${d.conds.includes(c)?'on':''}" data-act="cond" data-v="${c}">${c}</button>`).join('')}</div></div>
  <div class="field"><label for="allergy">Allergies</label><input id="allergy" placeholder="For example penicillin, peanuts" value="${esc(d.allergy)}"></div>
  <div class="field"><label for="meds">Current medicines</label><textarea id="meds" placeholder="Name and dose, one per line">${esc(d.meds)}</textarea></div>
  <div class="field"><label for="ecName">Emergency contact name</label><input id="ecName" value="${esc(d.ecName)}"></div>
  <div class="field"><label for="ecPhone">Emergency contact mobile</label><input id="ecPhone" inputmode="numeric" maxlength="10" value="${esc(d.ecPhone)}"></div>`;
 } else {
  body=`<h2>Past medical records</h2><p class="muted small" style="margin:4px 0 14px">Step 3 of 3. Upload old reports, bills or prescriptions now, or skip and add them later.</p>
  ${uploadForm('reg')}
  ${ui.draftRecs.length?`<div class="stack" style="margin-top:14px">${ui.draftRecs.map((r,i)=>`<div class="card row between"><div class="row">${ic('file')}<div><b>${esc(r.type)}</b><div class="small muted">${esc(r.name)} · ${size(r.size)}</div></div></div><button class="btn ghost" data-act="rmDraftRec" data-i="${i}">Remove</button></div>`).join('')}</div>`:''}`;
 }
 return `<div class="topbar">${st>1?`<button class="back" data-act="regBack" aria-label="Back">${ic('back')}</button>`:''}<h2>Create your profile</h2></div>
 <div class="scroll">${steps}${body}${ui.err?`<div class="err" style="margin-bottom:10px">${esc(ui.err)}</div>`:''}
 <button class="btn" data-act="regNext">${st<3?'Continue':'Finish and open my wallet'}</button>
 ${st===3?`<button class="btn ghost" style="width:100%;margin-top:6px" data-act="regNext">Skip for now</button>`:''}
 </div>`;
}
function uploadForm(mode,memberSel){
 return `<div class="stack">
  ${memberSel?`<div><label for="upMember">For</label><select id="upMember">${D.members.map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.relation)})</option>`).join('')}</select></div>`:''}
  <div><label for="upType">Record type</label><select id="upType">${REC_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
  ${memberSel?`<div><label for="upDate">Date of record</label><input id="upDate" type="date" max="${today()}" value="${today()}"></div>`:''}
  <label class="drop" id="dropzone" for="upFile">${ic('upload')}<div>Tap to choose a file, or drop it here</div><div class="small muted" style="font-weight:500">PDF, JPG or PNG</div><input id="upFile" type="file" accept=".pdf,.jpg,.jpeg,.png,image/*,application/pdf"></label>
  <div id="upName" class="small muted"></div>
  <button class="btn alt" data-act="${mode==='reg'?'addDraftRec':'saveRecord'}">${mode==='reg'?'Add this record':'Save to wallet'}</button>
 </div>`;
}
function ringScore(){
 const s=score();
 return `<div class="score"><div class="row" style="gap:14px"><div class="ring" style="--p:${s.pct}"><b>${s.pct}%</b></div>
 <div><h3>Claim-ready</h3><p class="small muted">Could you file a claim today with nothing missing?</p></div></div>
 <div class="stack" style="gap:8px;margin-top:14px">${s.checks.map(c=>`<div class="check"><span class="dot ${c[1]?'done':''}">${c[1]?ic('check'):''}</span>${c[0]}</div>`).join('')}</div></div>`;
}
function nextStep(){
 const s=score();const c=s.checks;
 if(!c[2][1])return {t:'Add your insurance policy',b:'Upload it and we will list the cover in plain words.',a:'addPolicy',l:'Add policy'};
 if(!c[1][1])return {t:'Add an emergency contact',b:'Someone to call if you cannot.',a:'tabProfile',l:'Open profile'};
 const miss=CLAIM_DOCS.find(t=>!D.records.some(r=>r.member===D.members[0].id&&r.type===t));
 if(miss)return {t:'Complete your claim pack',b:'One document is still missing: '+miss.toLowerCase()+'.',a:'addRecord',l:'Add '+miss.toLowerCase()};

function dataToBlob(d){const [h,b]=d.split(',');const mime=h.match(/:(.*?);/)[1];const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}
function keepCopy(rec,file){const fr=new FileReader();fr.onload=()=>{if(fr.result.length<1.6e6){rec.data=fr.result;save()}};fr.readAsDataURL(file)}
async function renderPdf(file){
 const box=$('#pdfBox');if(!box)return;
 try{
  if(!window.pdfjsLib){await new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
   pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  box.innerHTML='';const n=Math.min(pdf.numPages,8),w=box.clientWidth||340;
  for(let i=1;i<=n;i++){const pg=await pdf.getPage(i),v0=pg.getViewport({scale:1}),v=pg.getViewport({scale:w/v0.width*(window.devicePixelRatio||1)});
   const cv=document.createElement('canvas');cv.width=v.width;cv.height=v.height;cv.style.cssText='width:100%;display:block;border:1px solid var(--line);border-radius:8px;margin-bottom:8px';
   box.appendChild(cv);await pg.render({canvasContext:cv.getContext('2d'),viewport:v}).promise}
  if(pdf.numPages>n)box.insertAdjacentHTML('beforeend','<p class="small muted">Showing the first '+n+' of '+pdf.numPages+' pages.</p>');
 }catch(e){box.innerHTML=`<iframe title="PDF preview" src="${URL.createObjectURL(file)}" style="width:100%;height:60vh;border:1px solid var(--line);border-radius:8px"></iframe>`}
}
function addRecordFrom(memberId,typeId,dateVal){

 FILES[rec.id]=file;keepCopy(rec,file);return rec;
}

  if(!openUser(ui.phone))go({screen:'reg',regStep:1,draft:{conds:[]},draftRecs:[],err:''})},
